[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sleeper-ff-tool"
version = "0.0.0"
description = "Personal, read-only tooling for one Sleeper redraft league: custom re-scoring, draft, lineup, and waiver decisions."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.32",
    "requests-cache>=1.2",
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=15.0",
    "nflreadpy>=0.1",
    "pulp>=2.8",
    "streamlit>=1.40",
    "polars>=1.0",
    # S3-compatible lake backend (store/s3.py, LAKE_BACKEND=s3 -> Backblaze B2). Required rather
    # than an extra because the collection crons install with a plain `pip install -e .` and would
    # otherwise resolve LAKE_BACKEND=s3 to an ImportError at 12:00 UTC on a Tuesday. Free, pure
    # Python, no compiled deps. The hosted dashboard installs from requirements.txt and is unaffected.
    "boto3>=1.34",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    # In-process S3 mock: tests/test_store_s3.py must never touch a real bucket. Chosen over a
    # localhost moto *server* because it intercepts below botocore, so the tests can assert which
    # byte ranges were requested -- which is how the cheap-metadata guarantees are actually pinned.
    "moto[s3]>=5.0",
    # tests/test_workflows.py parses .github/workflows/*.yml. Declared rather than leaned on as a
    # transitive of moto: the collection crons are config, so the only thing that can hold them to
    # their contract is a test that reads them, and it must not depend on an undeclared import.
    "pyyaml>=6.0",
]

# src/ layout: each subdirectory (sleeper, scoring, data, ...) is its own
# top-level importable package.
[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "apps"]

# Some hosts (e.g. Streamlit Community Cloud) install from this file with Poetry/uv rather than
# setuptools. We use a src/ layout with setuptools (above); tell Poetry/uv NOT to build this repo
# as a package -- consumers only need the declared dependencies. Local dev and the GitHub Actions
# refresh use `pip install -e .` (setuptools), which ignores these tool tables. The hosted dashboard
# pulls its (smaller) dependency set from requirements.txt instead.
[tool.poetry]
package-mode = false

[tool.uv]
package = false
