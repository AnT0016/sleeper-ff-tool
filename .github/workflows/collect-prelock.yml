name: Collect — pre-lock snapshot

# Captures the point-in-time, forward-only sources (Sleeper weekly/season projections, injuries, the
# market, the weather forecast) BEFORE kickoff, so we keep what was projected vs. what happened — data
# Sleeper's endpoints discard (they only ever serve the latest values). Runs scripts/collect.py, which
# reads the season/week from Sleeper's state and reads which sources belong to the "prelock" cadence
# from collect.registry. Rows land in the S3 lake (Backblaze B2), never in git.
#
# The script exits 1 when a forward-only source (sleeper_proj_*) fails — that snapshot is unrecoverable,
# so the run must go red. This step therefore invokes the script plainly: no `|| true`, no
# continue-on-error. A recoverable per-source failure still exits 0.
on:
  schedule:
    # Minutes offset to :20 to dodge the congested top-of-hour Actions slot; the pinned HOURS carry
    # the pre-lock buffer. Sunday is the thin one — 15:00 UTC to the 17:00 UTC (1pm ET) main slate is
    # only ~2h of buffer, so it must not drift later.
    - cron: "20 22 * * 4"   # Thursday ~22:00 UTC — before the Thursday Night Football lock
    - cron: "20 15 * * 0"   # Sunday   ~15:00 UTC — before the 1pm ET main slate
  workflow_dispatch:
    inputs:
      week:
        description: >-
          Leave blank — the current week is auto-detected. Only set this to re-run the CURRENT week
          after a failure. A past week cannot be recovered: Sleeper's projection endpoints serve only
          today's values, so a late re-run files today's numbers under that week.
        required: false
        type: string
      season:
        description: >-
          Leave blank — the season is auto-detected. Same caveat as week: the forward-only projection
          sources capture today's values, so a re-run cannot reconstruct a past season's snapshot.
        required: false
        type: string

# Least privilege: the job only needs to check the repo out. It writes to the S3 bucket, not the repo —
# there is no git add/commit/push step — so contents: read is all actions/checkout requires.
permissions:
  contents: read

# store.write_snapshot is read-modify-write on a partition (read prior rows, merge, dedup, write), so
# two runs touching the same partition concurrently would lose an update. The schedules never collide,
# but a manual dispatch can land on a scheduled run — and the postgame workflow shares this SAME group
# string, so at most one lake capture runs repo-wide at a time. cancel-in-progress: false because
# cancelling a prelock run mid-flight throws away forward-only rows that cannot be re-captured.
concurrency:
  group: lake-capture
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    # nflverse_depth is the ~858MB source and streamlit is a base dependency (heavier install), so give
    # the run real headroom; a prelock timeout costs forward-only rows.
    timeout-minutes: 30
    # LAKE_BACKEND=s3 sends every write to Backblaze B2; the four LAKE_S3_* values are Actions secrets
    # (LAKE_S3_REGION is optional — store/s3.py derives it from the endpoint host).
    env:
      LAKE_BACKEND: s3
      LAKE_S3_ENDPOINT: ${{ secrets.LAKE_S3_ENDPOINT }}
      LAKE_S3_ACCESS_KEY_ID: ${{ secrets.LAKE_S3_ACCESS_KEY_ID }}
      LAKE_S3_SECRET_ACCESS_KEY: ${{ secrets.LAKE_S3_SECRET_ACCESS_KEY }}
      LAKE_S3_BUCKET: ${{ secrets.LAKE_S3_BUCKET }}
    steps:
      # The last silent-loss path in the pipeline, and the only one not closed in code. A mistyped
      # LAKE_BACKEND raises (store/lake.py: "unknown LAKE_BACKEND"), and a missing LAKE_S3_* raises
      # S3ConfigError (#20) -- but an ABSENT LAKE_BACKEND resolves to the local-parquet dev backend,
      # which would write every partition to this runner's disk, print a healthy row count, exit 0,
      # and be destroyed with the runner. Green every Thursday and Sunday, capturing nothing, with
      # the forward-only projections unrecoverable each time. Two lines make that impossible.
      - name: Refuse to run against anything but the bucket
        run: |
          if [ "$LAKE_BACKEND" != "s3" ]; then
            echo "::error::LAKE_BACKEND=$LAKE_BACKEND - this capture would write to the runner's disk and be discarded with it; forward-only rows would be lost silently"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package
        run: python -m pip install --upgrade pip && python -m pip install -e .

      - name: Capture pre-lock snapshot
        # Dispatch inputs are read through env, never spliced into the run script (the shell
        # script-injection anti-pattern). They are also collected into an ARRAY and expanded quoted:
        # an unquoted "$ARGS" string splits on whitespace, so an input of `1 --mode postgame` would
        # inject a second flag rather than a bad week, and argparse would take the last --mode. Only
        # a collaborator can dispatch, so that was never a vulnerability -- but the array costs
        # nothing and removes the need to reason about it. Scheduled runs leave both blank, so
        # nothing is ever pinned and collect.py auto-detects season/week.
        env:
          WEEK: ${{ github.event.inputs.week }}
          SEASON: ${{ github.event.inputs.season }}
        run: |
          ARGS=(--mode prelock)
          if [ -n "$SEASON" ]; then ARGS+=(--season "$SEASON"); fi
          if [ -n "$WEEK" ]; then ARGS+=(--week "$WEEK"); fi
          echo "Running: scripts/collect.py ${ARGS[*]}"
          python scripts/collect.py "${ARGS[@]}"
